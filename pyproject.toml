[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-assistant-mcp"
version = "1.0.0"
description = "Research Assistant MCP Server — arXiv search, paper summarization, and note-taking"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "anthropic>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
research-assistant = "research_assistant.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]
